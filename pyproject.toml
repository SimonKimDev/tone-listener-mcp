[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tone-listener-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents listen to and compare guitar tone recordings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Simon Kim" }]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.13",
    "google-genai>=3,<4",
    "pydantic>=2",
    "httpx>=0.28",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]

[project.scripts]
tone-listener-mcp = "tone_listener_mcp.server:main"
tone-listener-web = "tone_listener_mcp.workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tone_listener_mcp"]
include = [
    "src/tone_listener_mcp/workbench/assets/di/*",
    "src/tone_listener_mcp/workbench/static/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["native_integration: opt-in installed Soundshed VST3 tests, never default CI"]
